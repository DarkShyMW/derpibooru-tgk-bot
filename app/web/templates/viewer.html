<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b1020"/>
  <title>Derpi Bot — Viewer</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="manifest" href="/manifest.json"/>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">👁️</div>
      <div>
        <div class="title">Derpibooru Bot</div>
        <div class="subtitle">Viewer (read-only)</div>
      </div>
    </div>
    <nav class="nav">
      <button class="theme-toggle" id="theme-toggle" title="Переключить тему">🌓 Тема</button>
      <a class="btn ghost" href="/">Публично</a>
      <form action="/auth/logout" method="post">
        <button class="btn ghost" type="submit">Выйти</button>
      </form>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <div class="row">
        <div class="chip" id="status-chip">Подключаемся…</div>
        <div class="chip" id="count-chip">0</div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" style="display:none;">Пока нет отправленных картинок</div>
  </main>

  <script src="/static/viewer.js"></script>
</body>
</html>
