name: Build Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: linux-arch
            target: linux-x86_64
          - os: windows-latest
            artifact_name: windows-10-11
            target: win-x86_64
          - os: macos-latest
            artifact_name: macos
            target: macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name ponybot app.py
        
    - name: Upload Artifact (${{ matrix.artifact_name }})
      uses: actions/upload-artifact@v4
      with:
        name: ponybot-${{ matrix.artifact_name }}
        path: dist/ponybot*
        retention-days: 30

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        dnf install -y python3 python3-pip python3-devel gcc
        pip3 install --break-system-packages -r requirements.txt
        pip3 install --break-system-packages pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name ponybot app.py
        
    - name: Upload Artifact (fedora)
      uses: actions/upload-artifact@v4
      with:
        name: ponybot-fedora
        path: dist/ponybot
        retention-days: 30

  build-ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y python3 python3-pip python3-venv
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        source .venv/bin/activate
        pyinstaller --onefile --name ponybot app.py
        
    - name: Upload Artifact (ubuntu)
      uses: actions/upload-artifact@v4
      with:
        name: ponybot-ubuntu
        path: dist/ponybot
        retention-days: 30
